<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamtava | Doctor Command Center</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="doctor-body">

    <div id="root"></div>

    <script type="text/babel">
        // ... (Paste the same React code from the previous turn here) ...
        // I will re-paste the condensed React logic below to make it easy for you.

        const { useState, useEffect } = React;
        const socket = io();

        const StatCard = ({ title, count, color, icon }) => (
            <div className={`bg-white p-6 rounded-xl shadow-sm border-l-4 ${color}`}>
                <div className="flex justify-between items-start">
                    <div>
                        <p className="text-xs font-bold text-gray-400 uppercase tracking-wider">{title}</p>
                        <h3 className="text-3xl font-bold text-gray-800 mt-1">{count}</h3>
                    </div>
                    <i className={`ph-fill ${icon} text-2xl text-gray-300`}></i>
                </div>
            </div>
        );

        function Dashboard() {
            const [patients, setPatients] = useState([]);
            const [stats, setStats] = useState({ crit: 0, high: 0, safe: 0 });

            useEffect(() => {
                fetch('/api/doctor/updates').then(res => res.json()).then(data => setPatients(data.reverse()));
                socket.on('doctor_alert', (newReport) => {
                    if (newReport.risk !== "Low") {
                        new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(e=>{});
                    }
                    setPatients(prev => [newReport, ...prev]);
                });
                return () => socket.off('doctor_alert');
            }, []);

            useEffect(() => {
                const crit = patients.filter(p => p.risk === "Critical").length;
                const high = patients.filter(p => p.risk === "High").length;
                const safe = patients.filter(p => p.risk === "Low").length;
                setStats({ crit, high, safe });
            }, [patients]);

            return (
                <div className="flex h-screen overflow-hidden">
                    <aside className="w-64 bg-slate-900 text-white flex flex-col p-6 hidden md:flex">
                        <div className="flex items-center gap-3 mb-10">
                            <i className="ph-fill ph-baby text-3xl text-purple-400"></i>
                            <div><h1 className="font-bold text-xl">Mamtava</h1><p className="text-xs text-slate-400">DOCTOR PORTAL</p></div>
                        </div>
                        <nav className="flex flex-col gap-4 text-sm font-medium">
                            <div className="p-3 bg-slate-800 rounded-lg text-purple-300 flex items-center gap-3"><i className="ph-fill ph-broadcast"></i> Live Triage</div>
                        </nav>
                    </aside>

                    <main className="flex-1 overflow-y-auto p-8">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-2xl font-bold text-slate-800">Dashboard Overview</h2>
                            <div className="flex items-center gap-2 px-4 py-2 bg-white rounded-full shadow-sm text-sm font-medium text-slate-600">
                                <span className="relative flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span> Live WebSocket Active
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                            <StatCard title="Critical" count={stats.crit} color="border-red-500 text-red-600" icon="ph-warning" />
                            <StatCard title="High Risk" count={stats.high} color="border-orange-500 text-orange-600" icon="ph-chart-line-up" />
                            <StatCard title="Safe" count={stats.safe} color="border-green-500 text-green-600" icon="ph-check-circle" />
                            <div className="bg-slate-800 p-6 rounded-xl shadow-sm text-white"><p className="text-xs font-bold text-slate-400 uppercase">Avg Response</p><h3 className="text-3xl font-bold mt-1">1.2s</h3></div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-6 border-b border-slate-100"><h3 className="font-bold text-slate-700">🚨 Live Stream</h3></div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase"><th className="p-4">Patient</th><th className="p-4">Vitals</th><th className="p-4">Symptoms</th><th className="p-4">Risk</th><th className="p-4">Action</th></tr></thead>
                                    <tbody className="text-sm divide-y divide-slate-100">
                                        {patients.map((p, idx) => {
                                            let riskStyle = "bg-green-100 text-green-700 border-green-200";
                                            let rowClass = "";
                                            if (p.risk === "Critical") { riskStyle = "bg-red-100 text-red-700 border-red-200"; rowClass = "animate-flash"; } 
                                            else if (p.risk === "High") { riskStyle = "bg-orange-100 text-orange-700 border-orange-200"; }
                                            return (
                                                <tr key={idx} className={`hover:bg-slate-50 transition-colors ${rowClass}`}>
                                                    <td className="p-4"><div className="font-bold text-slate-800">{p.name}</div><div className="text-xs text-slate-500">{p.mood}</div></td>
                                                    <td className="p-4 font-mono text-slate-600 font-medium">{p.vitals}</td>
                                                    <td className="p-4 text-slate-600">{p.symptoms}</td>
                                                    <td className="p-4"><span className={`px-2 py-1 rounded-md text-xs font-bold border ${riskStyle}`}>{p.risk.toUpperCase()} ({p.risk_score}%)</span></td>
                                                    <td className="p-4"><div className="font-bold text-slate-800 text-xs mb-1">{p.action}</div></td>
                                                </tr>
                                            );
                                        })}
                                        {patients.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-400">Waiting for data...</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
